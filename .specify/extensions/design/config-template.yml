# Design extension configuration.
# Copy to design-config.yml and adjust per project. Nothing here is
# feature-specific: per-feature values live in <feature>/design/manifest.json.

schema_version: "1.0"

source:
  # How design artifacts reach the repository.
  #   claude-design : read directly from a claude.ai/design project via the DesignSync tool
  #   figma         : read via an available Figma MCP tool
  #   manual        : the user drops exported files into <feature>/design/source/
  provider: manual

  # Optional default project identifier for the provider. Leave empty to be
  # asked per feature; the answer is persisted to the feature's manifest.json.
  project_id: ""

artifacts:
  # Directory holding design artifacts, relative to the feature directory.
  directory: design

  # Artifacts the design phase must produce. Rename or trim this list to match
  # the project's design vocabulary — the skills read it, nothing is hardcoded.
  required:
    - design-system.md
    - ia-screens-flows.md
    - wireframes.md
    - ux-ui-spec.md
    - open-decisions.md

  # Generated by the skills. Never hand-edit these; they are overwritten.
  generated:
    - brief.md
    - traceability.md
    - manifest.json

design_system:
  # Package that owns design tokens, if any. When set, the brief skill loads the
  # package's agent skill and states its real token vocabulary in the brief so
  # the designer works inside the token set the app can actually express.
  # Leave empty for projects with no shared token package.
  package: ""

  # Where token wiring lives once implemented. Referenced by the check skill.
  source_directory: "src/theme"

traceability:
  # Identifier prefixes in spec.md that design artifacts must cite.
  requirement_prefixes: ["FR-", "NFR-"]
  story_prefixes: ["US-"]
  success_criteria_prefixes: ["SC-"]

  # Prefix minted by the design phase for screens and flows.
  screen_prefix: "S-"
  flow_prefix: "F-"

validation:
  # lenient  : report only, never block
  # standard : CRITICAL findings block planning
  # strict   : CRITICAL and HIGH findings block planning
  strictness: standard

  # Constitution-derived UI gates the check skill must verify. Remove any that
  # do not apply to the project's platform.
  gates:
    - both_color_schemes_complete
    - no_state_conveyed_by_color_alone
    - minimum_touch_target
    - text_scaling_tolerated
    - navigation_depth_limit
    - primary_action_visible_without_scroll
    - all_async_states_designed
